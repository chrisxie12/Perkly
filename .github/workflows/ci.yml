name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
        env:
          # Fake, CI-only values. The build checks that these variables exist but never
          # connects to Supabase, so no real project, key or secret is used in CI.
          # They don't affect Vercel or any deployed environment.
          NEXT_PUBLIC_SITE_URL: https://perqly.example
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_real_key

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned like the migrate workflows: "latest" needs a GitHub API lookup that
          # hits rate limits on shared runners.
          version: 3.1.0
      # Starts only Postgres from the real Supabase image, applies supabase/migrations and seed.sql.
      - run: supabase db start
      - name: pgTAP tests (RLS, functions, constraints)
        run: supabase test db
      - name: Schema lint
        # --fail-on: without it, lint reports errors but still exits successfully.
        run: supabase db lint --level error --fail-on error
