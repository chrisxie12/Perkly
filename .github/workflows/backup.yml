name: Nightly database backup

# Dumps the production database every night, checks the dump, encrypts it and keeps
# it as a private workflow artifact for 14 days. See docs/BACKUPS.md.
#
# Secrets come from the `production-backup` environment (Settings → Environments),
# which only the main branch can use:
#   SUPABASE_DB_URL     production Session pooler connection string, with the password
#   BACKUP_PASSPHRASE   a long random passphrase, kept in your password manager
# If either is missing, or any check fails, the run fails with a red cross.

on:
  schedule:
    - cron: "17 1 * * *" # 01:17 UTC, before the 02:30 daily job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-backup
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Backup secrets are missing from the production-backup environment."
            echo "**Backup failed:** secrets are missing from the production-backup environment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          scripts/ci/check-db-url.sh production

      - name: Install the Postgres 17 client
        run: scripts/ci/install-pg-client.sh

      - name: Dump, check and encrypt
        id: backup
        run: scripts/ci/backup.sh out

      - name: Keep for 14 days
        uses: actions/upload-artifact@v6
        with:
          name: perqly-db-${{ steps.backup.outputs.stamp }}
          path: out/*.gpg
          retention-days: 14
          if-no-files-found: error
