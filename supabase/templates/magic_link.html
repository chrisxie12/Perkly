<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; background: #f8fafc; font-family: Arial, Helvetica, sans-serif; color: #1f2937">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 24px; font-size: 22px; font-weight: bold; color: #0066ff">perqly</p>
          <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.5">Your sign-in code is:</p>
          <p style="margin: 0 0 24px; font-size: 36px; font-weight: bold; letter-spacing: 8px">{{ .Token }}</p>
          <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: #4b5563">
            It expires in 10 minutes. You can also
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="color: #0052cc">sign in with this link</a> on the
            device you're signing in on.
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4b5563">
            If you didn't ask for this code, you can ignore this email. Never share this code with anyone, including someone who says
            they're from Perqly.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
